name: stock_opname_app
description: "Aplikasi Mobile Stock Opname Retail (Offline-First) untuk Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3      # Scanner kamera berkecepatan tinggi berbasis Google ML Kit
  sqflite: ^2.3.3+1           # Database lokal SQLite offline-first di smartphone
  path: ^1.9.0                # Manajemen path direktori database
  path_provider: ^2.1.3       # Mengakses folder Documents & Downloads di Android
  excel: ^4.0.6               # Membaca & membuat file .xlsx secara mandiri di HP
  share_plus: ^10.0.0         # Fitur berbagi file via WhatsApp, Gmail, Bluetooth, dll.
  intl: ^0.19.0               # Formatting tanggal dan jam (SOTGL, SOTIME)
  fluttertoast: ^8.2.8        # Notifikasi toast cepat saat scan berhasil

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
